{% extends 'base.html' %} 
{% load static %} 
{% block head %}
<link rel="stylesheet" href="{% static 'css/form.css' %}?v=999" />
{% endblock %} 
{% block content %}

<div class="page-header">
    {% if project %}
        <h1>Edit {{ project.song_title }}</h1>
    {% else %}
        <h1>Add a Project</h1>
    {% endif %}
</div>

<form action="" method="post" enctype="multipart/form-data" class="form-container">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <button type="submit" class="btn submit">Submit!</button>
</form>

{% endblock %}
