{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/home.css' %}?v=999" />
{% endblock %}

{% block content %}
<section class="home-page">
  <div class="home-card">
    <div class="home-logo-wrap">
      <img
        src="{% static 'images/dreamboard-logo.png' %}"
        alt="Dreamboard Logo"
        class="home-logo"
      />
    </div>

    <h1 class="home-title">DREAMBOARD</h1>
    <p class="home-subtitle">Music Video Production Workspace</p>

    <div class="home-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'project-index' %}" class="home-btn primary">Projects</a>
        <a href="{% url 'profile-detail' %}" class="home-btn secondary">Profile</a>
      {% else %}
        <a href="{% url 'login' %}" class="home-btn primary">Login</a>
        <a href="{% url 'signup' %}" class="home-btn secondary">Sign Up</a>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
