{% extends 'base.html' %}

{% block content %}
<h1>Delete Account</h1>
<p>Are you sure you want to delete your account?</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn danger">Yes, Delete My Account</button>
</form>

<a href="{% url 'profile-detail' %}" class="btn secondary">Cancel</a>
{% endblock %}
